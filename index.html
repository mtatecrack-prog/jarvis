<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
body {
    margin: 0;
    background: #080b10;
    color: #00e5ff;
    font-family: Arial, sans-serif;
    text-align: center;
}

.contenedor {
    width: 92%;
    max-width: 500px;
    margin: auto;
    padding-top: 30px;
}

h1 {
    font-size: 42px;
    letter-spacing: 8px;
}

#estado {
    color: #aaa;
    margin: 20px;
}

#respuesta {
    min-height: 140px;
    background: #111720;
    border: 1px solid #00e5ff;
    border-radius: 15px;
    padding: 20px;
    color: white;
    text-align: left;
    white-space: pre-wrap;
    margin-bottom: 30px;
}

button {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid #00e5ff;
    background: #071218;
    color: #00e5ff;
    font-size: 22px;
    font-weight: bold;
}

button.grabando {
    background: #00e5ff;
    color: #080b10;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>JARVIS</h1>

<div id="estado">Listo</div>

<div id="respuesta">Esperando una orden...</div>

<button id="boton">HABLAR</button>

</div>

<script>

let grabando = false;
let recorder;
let partes = [];

const boton = document.getElementById("boton");
const estado = document.getElementById("estado");
const respuesta = document.getElementById("respuesta");

boton.onclick = async () => {

    if (!grabando) {

        try {

            const stream = await navigator.mediaDevices.getUserMedia({
                audio: true
            });

            partes = [];

            recorder = new MediaRecorder(stream);

            recorder.ondataavailable = e => {
                if (e.data.size > 0) {
                    partes.push(e.data);
                }
            };

            recorder.onstop = enviarAudio;

            recorder.start();

            grabando = true;

            boton.textContent = "PARAR";
            boton.classList.add("grabando");

            estado.textContent = "Escuchando...";

        } catch (error) {

            estado.textContent = "No se pudo acceder al micrófono";

        }

    } else {

        recorder.stop();

        grabando = false;

        boton.textContent = "HABLAR";
        boton.classList.remove("grabando");

        estado.textContent = "Procesando...";

    }
};


async function enviarAudio() {

    estado.textContent = "Procesando voz...";

    const audio = new Blob(partes, {
        type: recorder.mimeType
    });

    const datos = new FormData();

    datos.append("audio", audio, "voz.webm");

    try {

        const respuestaServidor = await fetch("/audio", {
            method: "POST",
            body: datos
        });

        if (!respuestaServidor.ok) {
            throw new Error("Servidor: " + respuestaServidor.status);
        }

        const datosRespuesta = await respuestaServidor.json();

        console.log(datosRespuesta);

        respuesta.textContent =
            "Vos:\n" +
            datosRespuesta.texto +
            "\n\nJARVIS:\n" +
            datosRespuesta.respuesta;

        estado.textContent = "JARVIS respondió";

        hablar(datosRespuesta.respuesta);

    } catch (error) {

        console.error(error);

        respuesta.textContent =
            "Error conectando con JARVIS.\n\n" +
            error;

        estado.textContent = "Error";

    }
}


function hablar(texto) {

    speechSynthesis.cancel();

    const voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "es-AR";
    voz.rate = 0.90;
    voz.pitch = 0.75;
    voz.volume = 1.0;

    voz.onstart = () => {
        estado.textContent = "JARVIS hablando...";
    };

    voz.onend = () => {
        estado.textContent = "Listo";
    };

    speechSynthesis.speak(voz);
}

</script>

</body>
</html>
